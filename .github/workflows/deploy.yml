name: Deploy

# Deploys main to the project's Cloudflare Workers Free account: D1 migrations first, then the
# Worker with the Dashboard's static assets. Pull requests never run this workflow, so no pull
# request check reads a cloud credential (PRD §11).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  cloudflare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup
      - name: Build the Dashboard
        run: bun run --filter @davloom/web build
      - name: Apply the D1 migrations
        working-directory: apps/api
        run: bunx --bun wrangler d1 migrations apply davloom --remote
      - name: Deploy the Worker
        working-directory: apps/api
        run: bunx --bun wrangler deploy
