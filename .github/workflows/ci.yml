name: CI

on:
  # No branch filter: stacked pull requests target each other's branches until
  # GitHub retargets them to main.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup
      - run: bun run check

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup
      - run: bun run test:coverage
      # Also after a threshold failure, so the summary names the package below its threshold. tee
      # prints the table to the log as well, where `gh run view --log` shows it next to Vitest's
      # own errors; a job summary shows only on the run's page. shell: bash adds pipefail, so the
      # step still fails when a package is below.
      - name: Write each package's coverage to the job summary
        if: ${{ !cancelled() }}
        shell: bash
        run: bun run coverage:summary | tee -a "$GITHUB_STEP_SUMMARY"

  # OSV-Scanner reads every package in bun.lock, transitive ones included (Decision 4).
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: ./.github/actions/setup
        with:
          install: "false"
      - run: bun run scan:deps

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Gitleaks reads commits, so it needs the history behind the checked-out merge commit.
          fetch-depth: 0
      - name: Set up Bun
        uses: ./.github/actions/setup
        with:
          install: "false"
      # A pull request scans the commits it adds, and a push to main scans main's history. A pull
      # request checks out GitHub's merge commit. Its second parent is the head, and its first is
      # the head of the base branch or, for a pull request in a GitHub stack, GitHub's merge commit
      # of the pull request below, which holds the base branch and main. Either way HEAD^1..HEAD^2
      # holds the pull request's own commits; the event's base SHA can be older than the base
      # branch of a stacked pull request. Without --log-opts Gitleaks reads every ref, and
      # fetch-depth: 0 fetches every branch and tag, so an unmerged branch would fail main.
      # Gitleaks passes, having scanned nothing, when git log fails, so the step first checks that
      # the range's ends are commits.
      - name: Scan the commits for secrets
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git cat-file -e "HEAD^1^{commit}"
            git cat-file -e "HEAD^2^{commit}"
            bun run scan:secrets --log-opts="HEAD^1..HEAD^2"
          else
            git cat-file -e "$GITHUB_SHA^{commit}"
            bun run scan:secrets --log-opts="$GITHUB_SHA"
          fi

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: ./.github/actions/setup
        with:
          install: "false"
      - name: Check the workflows with actionlint
        run: bun run scan:actionlint
      # Also after an actionlint failure, so one run reports what both tools find. actionlint does
      # not read composite actions, so zizmor is the one check on .github/actions.
      - name: Check the workflows and local actions with zizmor
        if: ${{ !cancelled() }}
        run: bun run scan:zizmor

  compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup
      # The key names what decides the browser builds: the Ubuntu release, the CPU, the Playwright
      # version and the arguments of playwright:install, not the rest of bun.lock. actions/cache
      # saves nothing after a hit, so a key that missed a change would download on every run.
      - name: Compute the Playwright browser cache key
        id: playwright
        working-directory: tests/integration/compat
        run: |
          bun -e '
            const { scripts } = await Bun.file("package.json").json();
            const { version } = await Bun.file("node_modules/@playwright/test/package.json").json();
            if (!process.env.ImageOS) throw new Error("ImageOS is not set");
            const install = scripts["playwright:install"].replace(/[^A-Za-z0-9.]+/g, "-");
            console.log(`key=browsers-${process.env.ImageOS}-${process.arch}-${version}-${install}`);
          ' >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright.outputs.key }}
      - run: bun run --filter @davloom/compat-tests playwright:install
      - run: bun run test:compat
      # The runner discards test-results/ with the job. The config sets no screenshot, trace or
      # video, so error-context.md (the error, the page's accessibility tree at the failure and the
      # test source) is the one file a failed test writes, and the log shows only its path. Every
      # file prints, in a collapsed group, because each failed test can have its own cause.
      - name: Print the Playwright failure context
        if: failure()
        run: |
          dir=tests/integration/compat/test-results
          total=0
          while IFS= read -r file; do
            total=$((total + 1))
            echo "::group::$file"
            cat "$file"
            echo
            echo "::endgroup::"
          done < <(find "$dir" -name error-context.md 2>/dev/null | sort)
          echo "Found $total error-context.md under $dir"
