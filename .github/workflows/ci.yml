name: CI

on:
  # No branch filter: stacked pull requests target each other's branches until
  # GitHub retargets them to main.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup
      - run: bun run check

  compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup
      # The key names what decides the browser builds: the Ubuntu release, the CPU, the Playwright
      # version and the arguments of playwright:install, not the rest of bun.lock. actions/cache
      # saves nothing after a hit, so a key that missed a change would download on every run.
      - name: Compute the Playwright browser cache key
        id: playwright
        working-directory: tests/integration/compat
        run: |
          bun -e '
            const { scripts } = await Bun.file("package.json").json();
            const { version } = await Bun.file("node_modules/@playwright/test/package.json").json();
            if (!process.env.ImageOS) throw new Error("ImageOS is not set");
            const install = scripts["playwright:install"].replace(/[^A-Za-z0-9.]+/g, "-");
            console.log(`key=browsers-${process.env.ImageOS}-${process.arch}-${version}-${install}`);
          ' >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright.outputs.key }}
      - run: bun run --filter @davloom/compat-tests playwright:install
      - run: bun run test:compat
