name: CI

on:
  # No branch filter: stacked pull requests target each other's branches until
  # GitHub retargets them to main.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup
      - run: bun run check

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup
      - run: bun run test:coverage
      # Also after a threshold failure, so the summary names the package below its threshold. tee
      # prints the table to the log as well, where `gh run view --log` shows it next to Vitest's
      # own errors; a job summary shows only on the run's page. shell: bash adds pipefail, so the
      # step still fails when a package is below.
      - name: Write each package's coverage to the job summary
        if: ${{ !cancelled() }}
        shell: bash
        run: bun run coverage:summary | tee -a "$GITHUB_STEP_SUMMARY"

  # OSV-Scanner reads every package in bun.lock, transitive ones included (Decision 4).
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: ./.github/actions/setup
        with:
          install: "false"
      - run: bun run scan:deps

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Gitleaks reads commits, so it needs the history behind the checked-out merge commit.
          fetch-depth: 0
      - name: Set up Bun
        uses: ./.github/actions/setup
        with:
          install: "false"
      # A pull request scans the commits it adds, and a push to main scans main's history. A pull
      # request checks out GitHub's merge commit. Its second parent is the head, and its first is
      # the head of the base branch or, for a pull request in a GitHub stack, GitHub's merge commit
      # of the pull request below, which holds the base branch and main. Either way HEAD^1..HEAD^2
      # holds the pull request's own commits; the event's base SHA can be older than the base
      # branch of a stacked pull request. Without --log-opts Gitleaks reads every ref, and
      # fetch-depth: 0 fetches every branch and tag, so an unmerged branch would fail main.
      # Gitleaks passes, having scanned nothing, when git log fails, so the step first checks that
      # the range's ends are commits.
      - name: Scan the commits for secrets
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git cat-file -e "HEAD^1^{commit}"
            git cat-file -e "HEAD^2^{commit}"
            bun run scan:secrets --log-opts="HEAD^1..HEAD^2"
          else
            git cat-file -e "$GITHUB_SHA^{commit}"
            bun run scan:secrets --log-opts="$GITHUB_SHA"
          fi

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: ./.github/actions/setup
        with:
          install: "false"
      - name: Check the workflows with actionlint
        run: bun run scan:actionlint
      # Also after an actionlint failure, so one run reports what both tools find. actionlint does
      # not check the steps of a local action, so zizmor is the one check on them.
      - name: Check the workflows and local actions with zizmor
        if: ${{ !cancelled() }}
        run: bun run scan:zizmor

  # The compatibility tests, each suite or shard a job of its own so that they run side by side.
  # `bun run test:compat` runs the same suites one after the other.
  compat-suite:
    name: compat (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite:
          [
            http-1,
            http-2,
            http-3,
            http-4,
            http-5,
            d1,
            workerd,
            storage,
            s3,
            bun-sqlite,
            brand,
            cloud,
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup
      # The key names what decides the browser builds: the Ubuntu release, the CPU, the Playwright
      # version and the arguments of playwright:install, not the rest of bun.lock. actions/cache
      # saves nothing after a hit, so a key that missed a change would download on every run.
      - name: Compute the Playwright browser cache key
        if: matrix.suite == 'brand'
        id: playwright
        working-directory: tests/integration/compat
        run: |
          bun -e '
            const { scripts } = await Bun.file("package.json").json();
            const { version } = await Bun.file("node_modules/@playwright/test/package.json").json();
            if (!process.env.ImageOS) throw new Error("ImageOS is not set");
            const install = scripts["playwright:install"].replace(/[^A-Za-z0-9.]+/g, "-");
            console.log(`key=browsers-${process.env.ImageOS}-${process.arch}-${version}-${install}`);
          ' >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browsers
        if: matrix.suite == 'brand'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # Chromium alone, so its own key: the ui job caches all three browsers.
          key: ${{ steps.playwright.outputs.key }}-chromium
      # The brand check needs only Chromium, whose libraries the runner image has.
      - name: Install Chromium
        if: matrix.suite == 'brand'
        working-directory: tests/integration/compat
        run: bunx --bun playwright install chromium
      # The real WebDAV clients that http/clients.test.ts drives against the Worker.
      - name: Install litmus and rclone
        if: startsWith(matrix.suite, 'http-')
        run: sudo apt-get update -q && sudo apt-get install -y -q litmus rclone
      # From the repository root, where bunfig.toml starts on Bun the tools whose launchers name
      # Node; `bun run` inside a package directory does not.
      - name: Run the ${{ matrix.suite }} suite
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          compat() { bun run --filter @davloom/compat-tests "$@"; }
          case "$SUITE" in
            http-*)
              compat build:web
              cd tests/integration/compat
              bunx --bun vitest run --config vitest.http.config.ts --shard="${SUITE#http-}/5"
              ;;
            brand) compat test:ui:brand ;;
            cloud) compat test:cloud:local && compat test:cloud ;;
            *) compat "test:$SUITE" ;;
          esac
      # The runner discards test-results/ with the job. The config sets no screenshot, trace or
      # video, so error-context.md (the error, the page's accessibility tree at the failure and the
      # test source) is the one file a failed test writes, and the log shows only its path. Every
      # file prints, in a collapsed group, because each failed test can have its own cause.
      - name: Print the Playwright failure context
        if: failure() && matrix.suite == 'brand'
        run: |
          dir=tests/integration/compat/test-results
          total=0
          while IFS= read -r file; do
            total=$((total + 1))
            echo "::group::$file"
            cat "$file"
            echo
            echo "::endgroup::"
          done < <(find "$dir" -name error-context.md 2>/dev/null | sort)
          echo "Found $total error-context.md under $dir"

  # The Playwright specs against the production build, in Chromium, Firefox and WebKit, split in
  # six shards that run side by side; together they are what `bun run test:compat` runs last.

  # The one check the main Ruleset requires of the compatibility tests: it passes when every suite
  # and every shard of compat-suite and ui passed.
  compat:
    if: ${{ always() }}
    needs: [compat-suite, ui]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check that every suite and shard passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then exit 1; fi
          done

  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup
      # The key names what decides the browser builds: the Ubuntu release, the CPU, the Playwright
      # version and the arguments of playwright:install, not the rest of bun.lock. actions/cache
      # saves nothing after a hit, so a key that missed a change would download on every run.
      - name: Compute the Playwright browser cache key
        id: playwright
        working-directory: tests/integration/compat
        run: |
          bun -e '
            const { scripts } = await Bun.file("package.json").json();
            const { version } = await Bun.file("node_modules/@playwright/test/package.json").json();
            if (!process.env.ImageOS) throw new Error("ImageOS is not set");
            const install = scripts["playwright:install"].replace(/[^A-Za-z0-9.]+/g, "-");
            console.log(`key=browsers-${process.env.ImageOS}-${process.arch}-${version}-${install}`);
          ' >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright.outputs.key }}
      # The runner image has what Chromium needs, but not the libraries of Firefox and WebKit,
      # and playwright:install stops when a browser it installed cannot start. Ubuntu's mirror
      # can serve the 180-odd packages at a crawl, so the packages are cached, and a download
      # that stalls is stopped and tried again rather than left to run into the job's limit.
      - name: Cache the packages of the Firefox and WebKit libraries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ steps.playwright.outputs.key }}
      - name: Install the system libraries of Firefox and WebKit
        working-directory: tests/integration/compat
        timeout-minutes: 15
        run: |
          mkdir -p ~/apt-archives
          sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          for attempt in 1 2 3; do
            if timeout 300 bunx --bun playwright install-deps firefox webkit; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "::warning::installing the libraries failed or stalled, attempt $attempt"
          done
          cp /var/cache/apt/archives/*.deb ~/apt-archives/ 2>/dev/null || true
      - run: bun run --filter @davloom/compat-tests playwright:install
      - name: Build the Dashboard
        run: bun run --filter @davloom/compat-tests build:web
      - name: Run shard ${{ matrix.shard }} of 6 of the Playwright specs
        working-directory: tests/integration/compat
        env:
          SHARD: ${{ matrix.shard }}
        run: bunx --bun playwright test --shard="$SHARD/6"
      # The runner discards test-results/ with the job. The config sets no screenshot, trace or
      # video, so error-context.md (the error, the page's accessibility tree at the failure and the
      # test source) is the one file a failed test writes, and the log shows only its path. Every
      # file prints, in a collapsed group, because each failed test can have its own cause.
      - name: Print the Playwright failure context
        if: failure()
        run: |
          dir=tests/integration/compat/test-results
          total=0
          while IFS= read -r file; do
            total=$((total + 1))
            echo "::group::$file"
            cat "$file"
            echo
            echo "::endgroup::"
          done < <(find "$dir" -name error-context.md 2>/dev/null | sort)
          echo "Found $total error-context.md under $dir"
