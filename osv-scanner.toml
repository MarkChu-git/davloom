reason = "minimatch 10.2.6 comes only from @stryker-mutator/core 10.1.1, the npm latest, which asks for ~10.2.4. Stryker runs in development and in the mutation workflow, never in Davloom, and matches only the file globs in the repository's own Stryker config. Remove the exception once Stryker allows minimatch 11.0.1 or later."
