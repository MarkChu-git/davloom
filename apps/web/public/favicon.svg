<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Davloom's mark as LoomMark draws it, in the accent of the scheme the browser prefers. -->
  <style>
    svg { color: #111111; }
    @media (prefers-color-scheme: dark) { svg { color: #f1f1f1; } }
  </style>
  <defs>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="16" y1="12.5" x2="16" y2="19.5">
      <stop offset="0.38" stop-color="currentColor" stop-opacity="0.22"/>
      <stop offset="0.62" stop-color="currentColor"/>
    </linearGradient>
    <mask id="behind" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="white"/>
      <circle cx="16" cy="16" r="7.8" fill="black" stroke="black" stroke-width="2.3"/>
      <path d="M1.4 16A14.6 3.5 0 0 0 30.6 16" transform="rotate(-22 16 16)" fill="none" stroke="white" stroke-width="2.7"/>
    </mask>
    <mask id="seam" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="white"/>
      <path d="M1.4 16A14.6 3.5 0 0 0 30.6 16" transform="rotate(-22 16 16)" fill="none" stroke="black" stroke-width="4.6"/>
    </mask>
  </defs>
  <g mask="url(#behind)">
    <g transform="rotate(-22 16 16)">
      <ellipse cx="16" cy="16" rx="14.6" ry="3.5" fill="none" stroke="url(#fade)" stroke-width="2.3"/>
    </g>
  </g>
  <g mask="url(#seam)">
    <circle cx="16" cy="16" r="7.8" fill="currentColor"/>
  </g>
</svg>
