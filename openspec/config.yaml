schema: spec-driven

context: |
  Language: English
  All artifacts must be written in English. Archived changes under openspec/changes/archive/ keep the language they were written in.

  Product: Davloom, an open-source, self-hostable WebDAV file storage platform that turns storage such as Durable Objects, R2, AWS S3 and RustFS into a standard WebDAV service. Requirements come from prd.md at the repository root. When a spec conflicts with the PRD, raise the conflict first instead of choosing one silently.

  Stack:
  - Languages and tools: TypeScript 7 (native tsc), Bun Workspaces, Oxlint, Oxfmt, Vitest, @cloudflare/vitest-plugin, Playwright, GitHub Actions, Changesets
  - Frontend: React 19, TanStack Start / Router / Query / Store / Virtual, Meta Astryx, StyleX (@stylexjs/unplugin), Lucide. Tailwind, shadcn/ui and Radix are not base dependencies
  - Backend: ElysiaJS is only the HTTP entry point. Effect v4 orchestrates the business logic, with Effect Schema for validation, Effect Typed Errors for errors, saxes for XML parsing, Web Streams for streams and Web Crypto for cryptography
  - Identity: Better Auth manages identity, sessions and API Keys; the Effect Policy Service decides file, Mount and path permissions
  - Data: Drizzle ORM with the SQLite dialect. In the cloud, D1 plus Durable Objects (SQLite backend, holding file contents), with R2 optional and no KV. Self-hosted, Bun SQLite plus S3-compatible storage (AWS SDK S3 Client), with RustFS as the open-source option and no MinIO

  Architecture constraints (Hexagonal + Effect Layers):
  - Domain code does not depend on cloud vendor SDKs
  - The Elysia Router never touches storage backends or D1 directly, and TanStack Start never reads the database directly
  - Effect Services reach infrastructure through Ports, and every Adapter must pass the shared contract tests
  - Cloudflare-only features appear only in the Infrastructure Layer

  UI constraints:
  - Use existing Astryx components and design tokens first; do not reimplement generic components or modify dependency source
  - Astryx ships as its official precompiled CSS and Davloom's own styles use StyleX; do not add a second CSS-in-JS library
  - Pin the tested Astryx version; the StyleX version follows the Astryx peer dependency

  Protocol and security constraints:
  - Never advertise a protocol capability that is not implemented correctly
  - Storage is private by default with least privilege, and cross-Mount operations are denied by default
  - Prevent path traversal, limit XML size and parsing complexity, and keep recursive operations from exhausting resources
  - API Keys are never stored in plaintext long-term, and logs never record sensitive authentication data
  - WebDAV does not use the administrator's primary account password as its default authentication scheme

  V1 scope decisions:
  - WebDAV Class 2 (LOCK / UNLOCK) is a V1 release gate
  - V1 has one administrator account and multiple API Keys. Mounts and path permissions are bound to credentials, and there is no multi-user support
  - The 100 MB request body limit on Cloud Free is an explicit product limit and is documented
  - Directory COPY/MOVE has a synchronous processing limit. A request over the limit is not partially executed; it returns a clear error

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours
rules:
  specs:
    - Each scenario must be convertible into an automated test; when it needs a real deployment or manual verification, say so explicitly
  design:
    - Describe how Cloudflare Workers and Bun differ for the change, and say so when they do not
  tasks:
    - Each task states how it is verified

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
operations:
  apply:
    guidance:
      - When a task starts or finishes, set the issue with the same number in the Linear project davloom (P-MAR-3) to In Progress or Done
  archive:
    guidance:
      - Before archiving, confirm that every Linear issue for the change is closed
